<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hugo theme test cover</title>
  <desc id="desc">A dark gradient cover used to test responsive images.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#background)"/>
  <circle cx="1030" cy="110" r="170" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="590" r="230" fill="#ffffff" opacity="0.06"/>
  <text x="80" y="285" fill="#ffffff" font-family="system-ui, sans-serif" font-size="72" font-weight="700">Hugo Theme Test</text>
  <text x="84" y="370" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="34">HanYayaya.github.io · GitHub Pages</text>
</svg>
