<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">HanYayaya avatar placeholder</title>
  <desc id="desc">A configurable placeholder avatar with the letter H.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#background)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="4"/>
  <text x="128" y="162" fill="#fff" font-family="system-ui, sans-serif" font-size="104" font-weight="700" text-anchor="middle">H</text>
</svg>
