<nav class="home-pagination card" aria-label="首页文章翻页">
  {{ if .HasPrev }}
    <a class="page-button" href="{{ .Prev.URL }}" aria-label="上一页">←</a>
  {{ else }}
    <span class="page-button is-disabled" aria-hidden="true">←</span>
  {{ end }}

  <span class="page-indicator">{{ .PageNumber }} / {{ .TotalPages }}</span>

  {{ if .HasNext }}
    <a class="page-button" href="{{ .Next.URL }}" aria-label="下一页">→</a>
  {{ else }}
    <span class="page-button is-disabled" aria-hidden="true">→</span>
  {{ end }}
</nav>
