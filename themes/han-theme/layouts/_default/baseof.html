<!doctype html>
<html lang="{{ site.Language.Locale | default `zh-CN` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body{{ if .IsHome }} class="home-page"{{ else if and .IsPage (eq .Section `posts`) }} class="article-page"{{ end }}>
    {{ partial "header.html" . }}
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
