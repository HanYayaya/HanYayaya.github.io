baseURL: "https://hanyayaya.github.io/"
locale: "zh-CN"
title: "HanYayaya Blog"
theme: "han-theme"
enableRobotsTXT: true

pagination:
  pagerSize: 10

permalinks:
  posts: "/posts/:slug/"

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: true
    lineNos: true

params:
  author: "HanYayaya"
  description: "HanYayaya 的个人博客"
  profile:
    name: "HanYayaya"
    avatar: "/images/avatar.jpg"
    signature: "记录技术、生活与思考"
  links:
    - title: "全部文章"
      url: "/posts/"
    - title: "文章分类"
      url: "/categories/"
    - title: "标签索引"
      url: "/tags/"
    - title: "RSS 订阅"
      url: "/index.xml"
