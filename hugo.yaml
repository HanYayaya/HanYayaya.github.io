baseURL: "https://hanyayaya.github.io/"
locale: "zh-CN"
title: "橘子味硬糖's Blog"
theme: "han-theme"
enableRobotsTXT: true

pagination:
  pagerSize: 10

permalinks:
  posts: "/posts/:slug/"

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark
    lineNos: true
    lineNumbersInTable: false

params:
  author: "橘子味硬糖"
  description: "橘子味硬糖 的个人博客"
  profile:
    name: "橘子味硬糖"
    avatar: "/images/avatar.jpg"
    signature: "记录技术与生活"
  links:
    - title: "全部文章"
      url: "/posts/"
    - title: "文章分类"
      url: "/categories/"
    - title: "RSS 订阅"
      url: "/index.xml"
